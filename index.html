// ─── LEADERBOARD ─────────────────────────────────────────────────────────────
const Stats = ({ wineries, onSelect }) => {
  const visited = wineries.filter(w=>w.visited);
  const rated = visited.filter(w=>getOverall(w)!=null);
  const totalBottles = visited.reduce((s,w)=>s+(w.bottles||0),0);
  const sorted = [...rated].sort((a,b)=>getOverall(b)-getOverall(a));
  const topWine = [...rated].filter(w=>avgRatingField(w,"wine")!=null).sort((a,b)=>avgRatingField(b,"wine")-avgRatingField(a,"wine"))[0];
  const topLocation = [...rated].filter(w=>avgRatingField(w,"location")!=null).sort((a,b)=>avgRatingField(b,"location")-avgRatingField(a,"location"))[0];
  const topVibes = [...rated].filter(w=>avgRatingField(w,"vibes")!=null).sort((a,b)=>avgRatingField(b,"vibes")-avgRatingField(a,"vibes"))[0];
  const topService = [...rated].filter(w=>avgRatingField(w,"service")!=null).sort((a,b)=>avgRatingField(b,"service")-avgRatingField(a,"service"))[0];
  const bigSpender = visited.filter(w=>w.bottles).sort((a,b)=>(b.bottles||0)-(a.bottles||0))[0];

  return (
    <div>
      {/* Stats row */}
      <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:10,marginBottom:16}}>
        {[[visited.length,"Visited",C.sageLight,C.sage],[wineries.length-visited.length,"To Visit",C.blueLight,C.dustyBlue],[totalBottles,"Bottles",C.earthLight,C.earth],[wineries.length,"Total",C.pinkLight,C.dustyPink]].map(([val,lbl,bg,col])=>(
          <div key={lbl} style={{background:bg,borderRadius:14,padding:"14px 16px",textAlign:"center"}}>
            <div style={{fontSize:26,fontWeight:700,color:col}}>{val}</div>
            <div style={{fontSize:11,color:col,opacity:0.8}}>{lbl}</div>
          </div>
        ))}
      </div>

      {/* Category winners */}
      <div style={{fontFamily:"'Palatino Linotype',Georgia,serif",fontSize:15,fontWeight:700,color:C.text,marginBottom:10}}>Category Bests</div>
      {[[<Icons.Trophy size={16} color={C.gold}/>, "Overall Champion", sorted[0], getOverall(sorted[0])?.toFixed(1)],
        [<Icons.WineGlass size={15} color={C.dustyPink}/>, "Best Wine", topWine, avgRatingField(topWine,"wine")?.toFixed(1)],
        [<Icons.Pin size={15} color={C.dustyBlue}/>, "Best Location", topLocation, avgRatingField(topLocation,"location")?.toFixed(1)],
        [<Icons.Sparkle size={15} color={C.sage}/>, "Best Vibes", topVibes, avgRatingField(topVibes,"vibes")?.toFixed(1)],
        [<Icons.Handshake size={15} color={C.earth}/>, "Best Service", topService, avgRatingField(topService,"service")?.toFixed(1)],
        [<Icons.Bottle size={15} color={C.dustyBlue}/>, "Most Bottles", bigSpender, bigSpender?`${bigSpender.bottles} btl`:null],
      ].map(([icon, label, winner, score], i) => winner && score && (
        <button key={i} onClick={()=>onSelect && onSelect(winner)}
          style={{width:"100%",textAlign:"left",background:C.white,border:`1px solid ${C.border}`,borderRadius:12,padding:"10px 14px",marginBottom:8,display:"flex",alignItems:"center",gap:10,cursor:"pointer",fontFamily:"inherit",transition:"transform 0.08s, box-shadow 0.15s"}}
          onMouseEnter={e=>e.currentTarget.style.boxShadow=`0 3px 12px rgba(126,30,48,0.12)`}
          onMouseLeave={e=>e.currentTarget.style.boxShadow=""}
          onMouseDown={e=>e.currentTarget.style.transform="scale(0.99)"}
          onMouseUp={e=>e.currentTarget.style.transform=""}>
          <div style={{width:32,height:32,borderRadius:10,background:C.earthLight,display:"flex",alignItems:"center",justifyContent:"center",flexShrink:0}}>{icon}</div>
          <div style={{flex:1,minWidth:0}}>
            <div style={{fontSize:10,color:C.textLight,fontWeight:600,letterSpacing:0.3,marginBottom:1}}>{label}</div>
            <div style={{fontSize:13,fontWeight:700,color:C.text,overflow:"hidden",textOverflow:"ellipsis",whiteSpace:"nowrap"}}>{winner?.name}</div>
          </div>
          <div style={{background:C.sageLight,borderRadius:10,padding:"4px 10px",fontSize:13,fontWeight:700,color:C.sage,flexShrink:0}}>{score}</div>
          <span style={{fontSize:16,color:C.textLight,marginLeft:2}}>›</span>
        </button>
      ))}

    ? '<circle class="pulse-halo" cx="' + r + '" cy="' + r + '" r="' + (r + 4) + '" fill="' + fill + '" fill-opacity="0.28"/>'
    : '';
  return [
    '<svg width="', size + 10, '" height="', size + 10,
      '" viewBox="0 0 ', size + 10, ' ', size + 10, '" xmlns="http://www.w3.org/2000/svg">',
      '<defs><filter id="', uid, 'sh" x="-40%" y="-40%" width="180%" height="180%">',
        '<feDropShadow dx="0" dy="1" stdDeviation="1.2" flood-color="#2a1810" flood-opacity=".25"/>',

  ].join('');
}

// Pure utility helpers
function mapHaversineKm(a, b){
  const toRad = d => d * Math.PI / 180, R = 6371;
  const dLat = toRad(b.lat - a.lat), dLng = toRad(b.lng - a.lng);
  const la1 = toRad(a.lat), la2 = toRad(b.lat);
  const h = Math.sin(dLat/2)**2 + Math.cos(la1) * Math.cos(la2) * Math.sin(dLng/2)**2;
  return 2 * R * Math.asin(Math.sqrt(h));
}
function mapEscapeHtml(s){
  return String(s == null ? '' : s).replace(/[&<>"']/g, c => ({ '&':'&amp;', '<':'&lt;', '>':'&gt;', '"':'&quot;', "'":'&#39;' }[c]));
}
function fmtMin(min) {
  if (min < 60) return min + ' min';
  const h = Math.floor(min / 60), m = min % 60;
  return m ? h + 'h ' + m + 'min' : h + 'h';
}
// Greedy pixel-space deconflict so overlapping pins separate gracefully
function deconflictPoints(map, items, minPx){
  minPx = minPx || 36;
  const zRef = 13;
  const pts = items.map(it => ({ it, p: map.project([it.lat, it.lng], zRef) }));
  for (let iter = 0; iter < 24; iter++) {
    let moved = false;
    for (let i = 0; i < pts.length; i++) {
      for (let j = i + 1; j < pts.length; j++) {
        const a = pts[i], b = pts[j];
        const dx = b.p.x - a.p.x, dy = b.p.y - a.p.y;
        const d = Math.hypot(dx, dy) || 0.01;
        if (d < minPx) {
          const push = (minPx - d) / 2 + 0.1;
          const ux = dx / d, uy = dy / d;
          a.p.x -= ux * push; a.p.y -= uy * push;
          b.p.x += ux * push; b.p.y += uy * push;
          moved = true;
        }
      }
    }
    if (!moved) break;
  }
  return pts.map(({ it, p }) => { const ll = map.unproject(p, zRef); return Object.assign({}, it, { lat: ll.lat, lng: ll.lng }); });
}

const DayPlanModal = ({ stops, legMins, dwellMins, returnHome, onClose, routeKm }) => {
  const [startTime, setStartTime] = React.useState('10:00');
  const [copied, setCopied] = React.useState(false);

  const timeline = React.useMemo(() => {
    const entries = [];
    const [sh, sm] = startTime.split(':').map(Number);
    let t = sh * 60 + sm;
    const fmt = n => String(Math.floor(n/60)%24).padStart(2,'0') + ':' + String(n%60).padStart(2,'0');

    entries.push({ kind:'place', home:true, name:'Home · 25 Riebe St, Tanunda', time:fmt(t) });
    stops.forEach((w, i) => {
      const drv = legMins[i] != null ? legMins[i] : 0;
      entries.push({ kind:'transit', min:drv });
      t += drv;
      const isLast = i === stops.length - 1;
      entries.push({ kind:'place', home:false, name:w.name, time:fmt(t), dwell:dwellMins, noLine: isLast && !returnHome });
      t += dwellMins;
    });
    if (returnHome) {
      const drv = legMins[stops.length] != null ? legMins[stops.length] : 0;
      entries.push({ kind:'transit', min:drv });
      t += drv;
      entries.push({ kind:'place', home:true, name:'Home · 25 Riebe St, Tanunda', time:fmt(t), noLine:true });
    }
    return entries;
  }, [stops, legMins, dwellMins, returnHome, startTime]);

  const buildText = () => {
    const lines = ['🍷 Ze Barossa — Day Plan', stops.length + ' wineries · ' + (routeKm||'?') + ' km · Depart ' + startTime, ''];
    timeline.forEach(e => {
      if (e.kind === 'transit') lines.push('  ↓ ' + fmtMin(e.min) + ' drive');
      else lines.push(e.time + '  ' + (e.home ? '🏠' : '🍷') + ' ' + e.name + (e.dwell ? ' (' + e.dwell + 'min tasting)' : ''));
    });
    return lines.join('\n');
  };

  const handleShare = () => {
    const text = buildText();
    if (navigator.share) { navigator.share({ title:'Ze Barossa Day Plan', text }); }
    else { navigator.clipboard.writeText(text).then(() => { setCopied(true); setTimeout(() => setCopied(false), 2000); }); }
  };

  const handlePrint = () => {
    const rows = timeline.map(e => e.kind === 'transit'
      ? '<tr><td></td><td style="color:#6e1c2c;font-style:italic;font-size:12px;padding:2px 0 2px 12px">↓ ' + fmtMin(e.min) + ' drive</td></tr>'
      : '<tr><td style="font-weight:700;font-size:15px;white-space:nowrap;padding-right:14px;vertical-align:top">' + e.time + '</td><td style="padding-bottom:8px"><div style="font-size:14px">' + e.name + '</div>' + (e.dwell ? '<div style="font-size:11px;color:#9a8070">' + e.dwell + ' min tasting</div>' : '') + '</td></tr>'
    ).join('');
    const win = window.open('', '_blank', 'width=480,height=700');
    win.document.write('<!DOCTYPE html><html><head><title>Day Plan</title><style>body{font-family:Georgia,serif;max-width:400px;margin:40px auto;color:#2d1f0f;line-height:1.5}h1{font-size:22px;margin:0 0 4px}p{color:#9a8070;font-size:13px;margin:0 0 24px}table{border-collapse:collapse;width:100%}@media print{@page{margin:1.5cm}button{display:none}}</style></head><body>'
      + '<h1>Ze Barossa — Day Plan</h1><p>' + stops.length + ' wineries · ' + (routeKm||'?') + ' km · Depart ' + startTime + '</p>'
      + '<table>' + rows + '</table>'
      + '<br><button onclick="window.print()" style="padding:8px 18px;background:#6e1c2c;color:#fff;border:none;border-radius:8px;font-size:13px;cursor:pointer">Print</button>'
      + '</body></html>');
    win.document.close();
  };

  return (
    <div className="zb-dayplan-overlay" onClick={e=>{ if(e.target===e.currentTarget) onClose(); }}>
      <div className="zb-dayplan-card">
        <div className="zb-dayplan-header">
          <span className="zb-dayplan-title">Day Plan</span>
          <button className="zb-dayplan-close" onClick={onClose}>✕</button>
        </div>
        <div className="zb-dayplan-startrow">
          <span className="zb-dayplan-startlabel">Depart home</span>
          <input className="zb-dayplan-startinput" type="time" value={startTime} onChange={e=>setStartTime(e.target.value)}/>
        </div>
        <div className="zb-dayplan-body">
          {timeline.map((entry, i) => entry.kind === 'transit' ? (
            <div key={i} className="zb-dp-transit">
              <div className="zb-dp-transit-spine"><div className="zb-dp-transit-line"/></div>
              <div className="zb-dp-transit-label">{fmtMin(entry.min)} drive</div>
            </div>
          ) : (
            <div key={i} className="zb-dp-place">
              <div className="zb-dp-spine">
                <div className={`zb-dp-dot${entry.home?' home':''}`}/>
                {!entry.noLine && <div className="zb-dp-vline"/>}
              </div>
              <div className="zb-dp-content">
                <div className="zb-dp-time">{entry.time}</div>
                <div className="zb-dp-name">{entry.name}</div>
                {entry.dwell && <div className="zb-dp-sub">{entry.dwell} min tasting</div>}
              </div>
            </div>
          ))}
        </div>
        <div className="zb-dayplan-actions">
          <button className="zb-dayplan-btn secondary" onClick={handlePrint}>🖨 Print</button>
          <button className="zb-dayplan-btn primary" onClick={handleShare}>{copied ? '✓ Copied!' : (navigator.share ? '↑ Share' : '⎘ Copy')}</button>
        </div>
      </div>
    </div>
  );
};

const MapView = ({ wineries, onSelect }) => {

  const [settingsOpen, setSettingsOpen]   = useState(false);
  const [focusMode, setFocusMode]         = useState(false);
  const [geoLoading, setGeoLoading]       = useState(false);

  // Popup HTML builder — closes over driveCacheRef for cached ETAs
  const popupHtml = useCallback((w) => {
    const status = deriveStatus(w);
    const overall = getOverall(w);
    const cached = driveCacheRef.current.get(w.id);
    const metaInner = cached
      ? etaMarkup(cached.min, cached.km, cached.estimated)

        }).join('') + '</div>'

      : '';
    const bottlesHtml = (w.bottles && w.bottles > 0)
      ? '<div class="pop-bottles">' + w.bottles + ' ' + (w.bottles === 1 ? 'bottle' : 'bottles') + ' bought</div>'
      : '';
    const overallHtml = overall != null
      ? '<div class="pop-overall"><span class="num">' + overall.toFixed(1) + '</span><span class="denom">/10 overall</span></div>'
      : '';
    const badgeLabel = MAP_STATUS[status].label;
    const tags = WINERY_TAGS[w.id] || [];
    const tagsHtml = tags.length
      ? '<div class="pop-tags">' + tags.map(t => '<span class="pop-tag ' + t + '" title="' + (TAG_META[t]||{}).title + '">' + (TAG_META[t]||{}).label + '</span>').join('') + '</div>'
      : '';
    return [
      '<div class="pop-name">', mapEscapeHtml(w.name), '</div>',
      '<span class="pop-badge ', status, '"><span class="dot"></span>', badgeLabel, '</span>',
      tagsHtml, overallHtml, ratingsHtml, notesHtml, bottlesHtml,
      '<div class="pop-meta" data-eta-for="', w.id, '">', metaInner, '</div>',
      '<div class="pop-actions">',
        '<button class="pop-btn pop-btn-addroute" data-addroute="', w.id, '">+ Add to Route</button>',
        '<button class="pop-btn secondary" data-details="', w.id, '">Open details</button>',
      '</div>'
    ].join('');
  }, []);

  function etaMarkup(min, km, estimated){
    const qualifier = estimated ? ' <span style="color:var(--zb-label-3)">(est.)</span>' : '';
    return '<strong style="color:var(--zb-label);font-weight:600">' + fmtMin(min) + '</strong> drive · ' + km.toFixed(1) + ' km' + qualifier;
  }

  async function fetchDriveTime(w){
    const coords = WINERY_COORDS[w.id];
    if (!coords) return { min:0, km:0, estimated:true };
    const lat = coords[0], lng = coords[1];
    const urls = [
      'https://routing.openstreetmap.de/routed-car/route/v1/driving/' + HOME_BASE.lng + ',' + HOME_BASE.lat + ';' + lng + ',' + lat + '?overview=false&alternatives=false&steps=false',
      'https://router.project-osrm.org/route/v1/driving/' + HOME_BASE.lng + ',' + HOME_BASE.lat + ';' + lng + ',' + lat + '?overview=false&alternatives=false&steps=false',
    ];
    for (const u of urls) {
      try {
        const r = await fetch(u, { headers: { Accept:'application/json' } });
        if (!r.ok) continue;
        const j = await r.json();
        const rt = j && j.routes && j.routes[0];
        if (rt && isFinite(rt.duration)) return { min: Math.max(1, Math.round(rt.duration/60)), km: rt.distance/1000, estimated:false };
      } catch(e) {}
    }
    const km = mapHaversineKm({ lat:HOME_BASE.lat, lng:HOME_BASE.lng }, { lat, lng });
    const roadKm = km * 1.32;
    return { min: Math.max(1, Math.round((roadKm / 55) * 60)), km: roadKm, estimated:true };
  }

  const clearRoute = useCallback(() => {
    const m = mapRef.current; if (!m) return;
    const R = routeRef.current;
    if (R.line) m.removeLayer(R.line);
    if (R.glow) m.removeLayer(R.glow);
    if (R.home) m.removeLayer(R.home);
    if (R.dest) m.removeLayer(R.dest);
    routeRef.current = { line:null, glow:null, home:null, dest:null };
    const pill = document.getElementById('zb-route-pill');
    if (pill) pill.classList.remove('show');
  }, []);

  const addToRoute = useCallback((w) => {
    setRouteStops(prev => prev.some(s => s.id === w.id) ? prev : [...prev, w]);
    setRoutePanelOpen(true);
    if ((WINERY_TAGS[w.id] || []).includes('appt')) {
      setApptWarning(w.name);
      setTimeout(() => setApptWarning(null), 5000);
    }
  }, []);

  const removeFromRoute = useCallback((id) => {
    setRouteStops(prev => prev.filter(s => s.id !== id));
  }, []);

  const moveStop = useCallback((i, dir) => {
    setRouteStops(prev => {
      const arr = [...prev], j = i + dir;
      if (j < 0 || j >= arr.length) return arr;
      [arr[i], arr[j]] = [arr[j], arr[i]];
      return arr;
    });
  }, []);

  const optimiseStops = useCallback(() => {
    if (routeStops.length < 2) return;
    let remaining = [...routeStops];
    let cur = { lat: HOME_BASE.lat, lng: HOME_BASE.lng };
    const ordered = [];
    while (remaining.length) {
      let bestIdx = 0, bestDist = Infinity;
      remaining.forEach((w, i) => {
        const c = WINERY_COORDS[w.id]; if (!c) return;
        const d = mapHaversineKm(cur, { lat: c[0], lng: c[1] });
        if (d < bestDist) { bestDist = d; bestIdx = i; }
      });
      const next = remaining.splice(bestIdx, 1)[0];
      ordered.push(next);
      const c = WINERY_COORDS[next.id];
      if (c) cur = { lat: c[0], lng: c[1] };
    }
    setRouteStops(ordered);
  }, [routeStops]);

  // Load persisted ETA cache on mount
  useEffect(() => {
    try {
      const saved = localStorage.getItem('barossa_eta_v1');
      if (saved) {
        const obj = JSON.parse(saved);
        Object.entries(obj).forEach(([id, eta]) => driveCacheRef.current.set(id, eta));
      }
    } catch(e) {}
  }, []);

  // Track system colour-scheme changes
  useEffect(() => {
    if (!window.matchMedia) return;
    const mq = window.matchMedia('(prefers-color-scheme: dark)');
    const handler = e => setIsDark(e.matches);
    if (mq.addEventListener) mq.addEventListener('change', handler);
    else mq.addListener(handler);
    return () => {
      if (mq.removeEventListener) mq.removeEventListener('change', handler);
      else mq.removeListener(handler);
    };
  }, []);

  // Swap tile base layer when isDark changes
  useEffect(() => {
    const map = mapRef.current;
    const ov  = overlaysRef.current;
    if (!map || !ov.lightBase || !ov.darkBase) return;
    if (isDark) {
      if (map.hasLayer(ov.lightBase)) map.removeLayer(ov.lightBase);
      if (!map.hasLayer(ov.darkBase)) ov.darkBase.addTo(map);
    } else {
      if (map.hasLayer(ov.darkBase)) map.removeLayer(ov.darkBase);
      if (!map.hasLayer(ov.lightBase)) ov.lightBase.addTo(map);
    }
    overlaysRef.current.basemap = isDark ? ov.darkBase : ov.lightBase;
  }, [isDark]);

  const buildGoogleMapsUrl = useCallback(() => {
    const parts = [HOME_BASE.lat + ',' + HOME_BASE.lng,
      ...routeStops.map(w => { const c = WINERY_COORDS[w.id]; return c ? c[0] + ',' + c[1] : null; }).filter(Boolean),
      ...(returnHome ? [HOME_BASE.lat + ',' + HOME_BASE.lng] : [])
    ];
    return 'https://www.google.com/maps/dir/' + parts.join('/');
  }, [routeStops, returnHome]);

  const buildMultiStopRoute = useCallback(async () => {
    if (!routeStops.length) return;
    const map = mapRef.current; if (!map || !window.L) return;
    const L = window.L;
    setRouteInfo({ loading: true });
    const profile = routeMode === 'bike' ? 'routed-bike' : 'routed-car';
    const waypoints = [
      [HOME_BASE.lng, HOME_BASE.lat],
      ...routeStops.map(w => { const c = WINERY_COORDS[w.id]; return c ? [c[1], c[0]] : null; }).filter(Boolean),
      ...(returnHome ? [[HOME_BASE.lng, HOME_BASE.lat]] : [])
    ];
    const waypointsStr = waypoints.map(([lng, lat]) => lng + ',' + lat).join(';');
    const urls = [
      'https://routing.openstreetmap.de/' + profile + '/route/v1/driving/' + waypointsStr + '?overview=full&geometries=geojson&steps=false',
      routeMode === 'car' ? 'https://router.project-osrm.org/route/v1/driving/' + waypointsStr + '?overview=full&geometries=geojson&steps=false' : null,
    ].filter(Boolean);
    let data = null;
    for (const u of urls) {
      try {
        const r = await fetch(u, { headers: { Accept: 'application/json' } });
        if (!r.ok) continue;
        const j = await r.json();
        if (j && j.routes && j.routes[0]) { data = j; break; }
      } catch(e) {}
    }
    clearRoute();
    const colour = routeMode === 'bike' ? '#3c5e34' : '#6e1c2c';
    if (!data) {
      const coordsLL = waypoints.map(([lng, lat]) => [lat, lng]);
      const line = L.polyline(coordsLL, { color: colour, weight: 3, opacity: .75, dashArray: '4 8' }).addTo(map);
      routeRef.current = { line, glow: null, home: null, dest: null };
      setRouteInfo({ km: '?', min: '?', totalMin: null, estimated: true, loading: false });
      return;
    }
    const rt = data.routes[0];
    const coordsLL = rt.geometry.coordinates.map(xy => [xy[1], xy[0]]);
    const glow = L.polyline(coordsLL, { color: colour, weight: 9, opacity: .18, lineCap: 'round', lineJoin: 'round' }).addTo(map);
    const line = L.polyline(coordsLL, { color: colour, weight: 4.5, opacity: .95, lineCap: 'round', lineJoin: 'round', dashArray: routeMode === 'bike' ? '2 6' : null }).addTo(map);
    // Animate route draw-on
    requestAnimationFrame(() => {
      try {
        const el = line.getElement ? line.getElement() : null;
        if (el) {
          const len = el.getTotalLength();
          el.style.strokeDasharray = len;
          el.style.strokeDashoffset = len;
          el.style.transition = 'stroke-dashoffset 1.1s cubic-bezier(.4,0,.2,1)';
          requestAnimationFrame(() => { el.style.strokeDashoffset = 0; });
        }
      } catch(e) {}
    });
    routeRef.current = { line, glow, home: null, dest: null };
    const km = (rt.distance / 1000).toFixed(1);
    const driveMin = Math.round(rt.duration / 60);
    const totalMin = driveMin + routeStops.length * dwellMins;
    const legMins = rt.legs ? rt.legs.map(l => Math.round(l.duration / 60)) : [];
    setRouteInfo({ km, min: driveMin, totalMin, legMins, estimated: false, loading: false });
    try { map.fitBounds(L.latLngBounds(coordsLL).pad(.06), { paddingTopLeft:[40,60], paddingBottomRight:[240,80], maxZoom:14 }); } catch(e) {}
  }, [routeStops, routeMode, clearRoute, dwellMins, returnHome]);

  // Auto-rebuild route whenever stops or mode change (debounced 700ms)
  useEffect(() => {
    if (!routeStops.length) { setRouteInfo(null); clearRoute(); return; }
    if (autoPlanTimer.current) clearTimeout(autoPlanTimer.current);
    setRouteInfo({ loading: true });
    autoPlanTimer.current = setTimeout(() => buildMultiStopRoute(), 700);
    return () => { if (autoPlanTimer.current) clearTimeout(autoPlanTimer.current); };
  }, [routeStops, routeMode, dwellMins, returnHome, buildMultiStopRoute, clearRoute]);

  async function fetchAndDrawRoute(w, mode){
    const coords = WINERY_COORDS[w.id]; if (!coords) return;
    const lat = coords[0], lng = coords[1];
    const map = mapRef.current; if (!map || !window.L) return;
    const L = window.L;
    const profile = mode === 'bike' ? 'routed-bike' : 'routed-car';
    const urls = [
      'https://routing.openstreetmap.de/' + profile + '/route/v1/driving/' + HOME_BASE.lng + ',' + HOME_BASE.lat + ';' + lng + ',' + lat + '?overview=full&geometries=geojson&steps=false',
      mode === 'car' ? 'https://router.project-osrm.org/route/v1/driving/' + HOME_BASE.lng + ',' + HOME_BASE.lat + ';' + lng + ',' + lat + '?overview=full&geometries=geojson' : null,
    ].filter(Boolean);

    const pill = document.getElementById('zb-route-pill');
    const pillText = document.getElementById('zb-route-pill-text');
    if (pill && pillText) { pill.classList.add('show'); pillText.innerHTML = '<b>Plotting…</b> ' + (mode === 'bike' ? 'cycling' : 'driving') + ' to ' + mapEscapeHtml(w.name); }

    let data = null;
    for (const u of urls) {
      try {
        const r = await fetch(u, { headers: { Accept:'application/json' } });
        if (!r.ok) continue;
        const j = await r.json();
        if (j && j.routes && j.routes[0]) { data = j; break; }
      } catch(e) {}
    }

    if (!data) {
      clearRoute();
      const colour = mode === 'bike' ? '#6b8a4e' : '#9c3f55';
      const line = L.polyline([[HOME_BASE.lat,HOME_BASE.lng],[lat,lng]], { color:colour, weight:3, opacity:.85, dashArray:'4 8' }).addTo(map);
      routeRef.current = { line, glow:null, home:null, dest:null };
      const km = mapHaversineKm({ lat:HOME_BASE.lat, lng:HOME_BASE.lng }, { lat, lng }).toFixed(1);
      if (pill && pillText) { pillText.innerHTML = '<b>Routing offline</b> · straight-line ' + km + ' km · ' + mapEscapeHtml(w.name); }
      return;
    }

    const rt = data.routes[0];
    const coordsLL = rt.geometry.coordinates.map(xy => [xy[1], xy[0]]);
    clearRoute();
    const colour = mode === 'bike' ? '#6b8a4e' : '#9c3f55';
    const glow = L.polyline(coordsLL, { color:colour, weight:9, opacity:.18, lineCap:'round', lineJoin:'round' }).addTo(map);
    const line = L.polyline(coordsLL, { color:colour, weight:4.2, opacity:.95, lineCap:'round', lineJoin:'round', dashArray: mode === 'bike' ? '2 6' : null }).addTo(map);
    const endpoint = (c, size) => L.divIcon({
      className:'zb-marker',
      html: '<svg width="' + size + '" height="' + size + '"><circle cx="' + (size/2) + '" cy="' + (size/2) + '" r="' + (size/2 - 1) + '" fill="#fff" stroke="' + c + '" stroke-width="2"/></svg>',
      iconSize:[size,size], iconAnchor:[size/2, size/2],
    });
    const home = L.marker([HOME_BASE.lat, HOME_BASE.lng], { icon: endpoint(colour, 10), interactive:false, zIndexOffset:1200 }).addTo(map);
    const dest = L.marker([lat, lng], { icon: endpoint(colour, 10), interactive:false, zIndexOffset:1200 }).addTo(map);
    routeRef.current = { line, glow, home, dest };
    map.fitBounds(L.latLngBounds(coordsLL).extend([HOME_BASE.lat, HOME_BASE.lng]), { paddingTopLeft:[40,60], paddingBottomRight:[200, 120], maxZoom:14 });
    const km = (rt.distance/1000).toFixed(1);
    const min = Math.round(rt.duration/60);
    if (pill && pillText) { pillText.innerHTML = '<b>' + (mode === 'bike' ? 'Cycle' : 'Drive') + '</b> · ' + km + ' km · ' + fmtMin(min) + ' · <span style="color:var(--zb-label-3)">' + mapEscapeHtml(w.name) + '</span>'; }
  }

  const wirePopup = useCallback((w) => {
    const popup = document.querySelector('.leaflet-popup-content');
    if (!popup) return;
    const addBtn = popup.querySelector('[data-addroute="' + w.id + '"]');
    if (addBtn) addBtn.addEventListener('click', () => {
      addToRoute(w);
      if (mapRef.current) mapRef.current.closePopup();
    });
    const detailBtn = popup.querySelector('[data-details="' + w.id + '"]');
    if (detailBtn) detailBtn.addEventListener('click', () => {
      if (onSelectRef.current) onSelectRef.current(w);
      if (mapRef.current) mapRef.current.closePopup();
    });
    if (!driveCacheRef.current.has(w.id)) {
      fetchDriveTime(w).then(eta => {
        driveCacheRef.current.set(w.id, eta);
        try {
          const obj = {};
          driveCacheRef.current.forEach((v, k) => { obj[k] = v; });
          localStorage.setItem('barossa_eta_v1', JSON.stringify(obj));
        } catch(e) {}
        const slot = document.querySelector('.pop-meta[data-eta-for="' + w.id + '"]');
        if (slot) slot.innerHTML = etaMarkup(eta.min, eta.km, eta.estimated);
      });
    }
  }, [clearRoute, addToRoute]);

  // Mount Leaflet once
  useEffect(() => {
    if (!window.L || !mapContainerRef.current || mapRef.current) return;
    const L = window.L;
    const BOUNDS = L.latLngBounds([-34.70, 138.80],[-34.38, 139.14]);
    const map = L.map(mapContainerRef.current, {
      center:[-34.522, 138.960], zoom:12, minZoom:11, maxZoom:17,
      maxBounds: BOUNDS.pad(0.4), maxBoundsViscosity:0.8,
      zoomControl:true, attributionControl:true,
      zoomAnimation:true, fadeAnimation:true, scrollWheelZoom:true,
    });

    const lightBase = L.tileLayer(
      'https://{s}.basemaps.cartocdn.com/rastertiles/voyager/{z}/{x}/{y}{r}.png',
      { subdomains:'abcd', maxZoom:19,
        attribution:'&copy; <a href="https://www.openstreetmap.org/copyright">OSM</a> · &copy; <a href="https://carto.com/attributions">CARTO</a>' }
    );
    const darkBase = L.tileLayer(
      'https://{s}.basemaps.cartocdn.com/dark_matter_lite/{z}/{x}/{y}{r}.png',
      { subdomains:'abcd', maxZoom:19,
        attribution:'&copy; <a href="https://www.openstreetmap.org/copyright">OSM</a> · &copy; <a href="https://carto.com/attributions">CARTO</a>' }
    );
    const startDark = !!(window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches);
    (startDark ? darkBase : lightBase).addTo(map);
    const basemap = startDark ? darkBase : lightBase;
    const roadsOverlay = L.tileLayer(
      'https://{s}.basemaps.cartocdn.com/rastertiles/voyager_only_labels/{z}/{x}/{y}{r}.png',
      { subdomains:'abcd', maxZoom:19, opacity:0.9, pane:'overlayPane' }
    ).addTo(map);
    const bikeOverlay = L.tileLayer(
      'https://{s}.tile-cyclosm.openstreetmap.fr/cyclosm/{z}/{x}/{y}.png',
      { subdomains:'abc', maxZoom:20, opacity:0.6,
        attribution:'Cycle layer © <a href="https://www.cyclosm.org">CyclOSM</a>' }
    );
    overlaysRef.current = { basemap, lightBase, darkBase, roadsOverlay, bikeOverlay };
    mapRef.current = map;

    // Town labels
    MAP_TOWNS.forEach(t => {
      const el = L.divIcon({
        className: 'zb-town-label' + (t.size === 'sm' ? ' sm' : ''),
        html: t.name, iconSize:[1,1], iconAnchor:[0,0],
      });
      L.marker([t.lat, t.lng], { icon: el, interactive:false, keyboard:false, pane:'markerPane' }).addTo(map);
    });

    // Home marker
    const homeSize = 58, homeH = Math.round(homeSize * 0.88);
    const homeMarker = L.marker([HOME_BASE.lat, HOME_BASE.lng], {
      icon: L.divIcon({
        className:'zb-marker', html: svgHome(homeSize),
        iconSize:[homeSize, homeH], iconAnchor:[homeSize/2, homeH-4],
        popupAnchor:[0, -homeH+6],
      }),
      zIndexOffset:1000, riseOnHover:true,
      title:'Home base · ' + HOME_BASE.name, alt:'Home base',
    }).addTo(map);
    homeMarker.bindPopup(
      '<div class="pop-name">Home base</div>' +
      '<span class="pop-badge" style="background:rgba(122,155,181,.14);color:#355370;border:1px solid rgba(122,155,181,.28)">' +
        '<span class="dot" style="background:#7a9bb5"></span>Our place</span>' +
      '<div class="pop-meta">' + HOME_BASE.name + '</div>',
      { offset:[0,-4] }
    );

    // Ensure the map sizes correctly in the flex container after paint
    setTimeout(() => { try { map.invalidateSize(); } catch(e) {} }, 60);

    return () => {
      try {
        if (mapRef.current) { mapRef.current.remove(); mapRef.current = null; }
      } catch(e) {}
      markersRef.current.clear();
      overlaysRef.current = {};
      routeRef.current = { line:null, glow:null, home:null, dest:null };
    };
    // eslint-disable-next-line
  }, []);

  // Rebuild winery markers whenever the live wineries list changes
  useEffect(() => {
    const map = mapRef.current;
    if (!map || !window.L) return;
    const L = window.L;

    // Remove previous winery markers
    markersRef.current.forEach(m => map.removeLayer(m));
    markersRef.current.clear();

    const items = wineries
      .map(w => {
        const coords = WINERY_COORDS[w.id];
        if (!coords) return null;
        return { id:w.id, name:w.name, lat:coords[0], lng:coords[1], status:deriveStatus(w), winery:w };
      })
      .filter(Boolean)
      .filter(it => !mapFilter || it.status === mapFilter)
      .filter(it => !tagFilter || (WINERY_TAGS[it.id] || []).includes(tagFilter));

    const placed = deconflictPoints(map, items, 16);

    placed.forEach(it => {
      const status = it.status;
      const dotSize  = status === 'visited' ? 14 : status === 'shortlisted' ? 14 : 11;
      const dotFill  = status === 'visited' ? '#6e1c2c' : status === 'shortlisted' ? '#c4a842' : '#b49090';
      const doPulse  = status === 'shortlisted';
      const svg      = svgDot(dotSize, dotFill, doPulse);
      const isAppt   = (WINERY_TAGS[it.id] || []).includes('appt');
      const w        = dotSize + 10;
      const h        = dotSize + 10;
      const anchor   = [w / 2, h / 2];
      const icon = L.divIcon({
        className:'zb-marker', html: svg + (isAppt ? svgStar() : ''),
        iconSize:[w,h], iconAnchor:anchor,
        popupAnchor:[0, -anchor[1] - 4],
      });
      const marker = L.marker([it.lat, it.lng], {
        icon, riseOnHover:true,
        zIndexOffset: MAP_STATUS[status].z * 10,
        title:it.name, alt:it.name,
      }).addTo(map);

      marker.bindPopup(popupHtml(it.winery), {
        offset:[0,-4], closeButton:true, autoPan:true,
        autoPanPadding:[40,80], maxWidth:300, minWidth:240,
      });
      marker.on('popupopen', () => wirePopup(it.winery));
      markersRef.current.set(it.id, marker);
    });

    // Fit to content on first build
    if (!map.__zbFitted) {
      map.__zbFitted = true;
      const all = [[HOME_BASE.lat, HOME_BASE.lng]].concat(placed.map(p => [p.lat, p.lng]));
      try {
        map.fitBounds(L.latLngBounds(all).pad(0.12), { paddingTopLeft:[30, 90], paddingBottomRight:[30, 120] });
      } catch(e) {}
    }
  }, [wineries, popupHtml, wirePopup, mapFilter, tagFilter]);

  const flyToWinery = useCallback((w) => {
    const map = mapRef.current; if (!map) return;
    const c = WINERY_COORDS[w.id]; if (!c) return;
    map.flyTo([c[0], c[1]], 15, { animate:true, duration:0.8 });
    setTimeout(() => {
      const m = markersRef.current.get(w.id);
      if (m) m.openPopup();
    }, 900);
  }, []);

  // Search results derived from mapSearch
  const searchResults = React.useMemo(() => {
    if (!mapSearch.trim()) return [];
    const q = mapSearch.toLowerCase();
    return wineries.filter(w => w.name.toLowerCase().includes(q)).slice(0, 8);
  }, [mapSearch, wineries]);

  // Layer toggles
  useEffect(() => {
    const map = mapRef.current, o = overlaysRef.current;
    if (!map || !o.roadsOverlay) return;
    if (roadsOn) map.addLayer(o.roadsOverlay); else map.removeLayer(o.roadsOverlay);
  }, [roadsOn]);
  useEffect(() => {
    const map = mapRef.current, o = overlaysRef.current;
    if (!map || !o.bikeOverlay) return;
    if (bikeOn) map.addLayer(o.bikeOverlay); else map.removeLayer(o.bikeOverlay);
  }, [bikeOn]);

  return (
    <div style={{position:"relative",width:"100%",height:"100%",minHeight:"60vh",background:"var(--zb-bg)"}} className={focusMode ? "zb-focus" : undefined}>
      <div ref={mapContainerRef} id="zb-leaflet" style={{position:"absolute",inset:0}}/>

      <div className="zb-title">
        <div className="k"><span style={{fontFamily:"'Great Vibes',cursive",fontSize:"1.3em",color:"var(--zb-earth)",letterSpacing:0,verticalAlign:"middle"}}>Ze</span> <span style={{letterSpacing:"0.18em"}}>BAROSSA</span></div>
      </div>

      <button className={`zb-settings-btn${settingsOpen ? ' open' : ''}`}
        onClick={()=>setSettingsOpen(o=>!o)} title="Map settings" aria-label="Map settings"
      >⚙</button>
      {settingsOpen && (
        <div className="zb-settings-tray">
          <div className="hdr">Layers</div>
          <div className="zb-row">
            <div className="lbl">Roads<small>Sealed &amp; scenic</small></div>
            <label className="zb-switch">
              <input type="checkbox" checked={roadsOn} onChange={e=>setRoadsOn(e.target.checked)}/>
              <span className="slider"/>
            </label>
          </div>
          <div className="zb-row">
            <div className="lbl">Bike trails<small>Barossa Trail &amp; loops</small></div>
            <label className="zb-switch">
              <input type="checkbox" checked={bikeOn} onChange={e=>setBikeOn(e.target.checked)}/>
              <span className="slider"/>
            </label>
          </div>
          <div className="zb-row">
            <div className="lbl">Dark tiles<small>Night-friendly map</small></div>
            <label className="zb-switch">
              <input type="checkbox" checked={isDark} onChange={e=>setIsDark(e.target.checked)}/>
              <span className="slider"/>
            </label>
          </div>
          <div className="sep"/>
          <div className="hdr" style={{marginTop:'2px'}}>Legend</div>
          <div className="zb-legend">
            <div className="item"><div className="swatch" dangerouslySetInnerHTML={{__html:svgHome(26)}}/><div className="txt">Home base<small>Where we stay</small></div></div>
            <div className="item"><div className="swatch" dangerouslySetInnerHTML={{__html:svgDot(14,'#6e1c2c',false)}}/><div className="txt">Visited<small>Tasted &amp; reviewed</small></div></div>
            <div className="item"><div className="swatch" dangerouslySetInnerHTML={{__html:svgDot(11,'#b49090',false)}}/><div className="txt">Not yet<small>On the longlist</small></div></div>
            <div className="item"><div className="swatch" dangerouslySetInnerHTML={{__html:svgDot(14,'#c4a842',true)}}/><div className="txt">Shortlisted<small>Priority pours</small></div></div>
          </div>
        </div>
      )}

      {/* Route Builder Panel */}
      <div className={`zb-route-builder${routePanelOpen ? ' open' : ''}`}>
        <button className="zb-rb-header" onClick={()=>setRoutePanelOpen(o=>!o)}>
          <span className="zb-rb-label">Route Planner</span>
          {routeStops.length > 0 && <span className="zb-rb-badge">{routeStops.length}</span>}
          {routeInfo && routeInfo.loading && <span className="zb-rb-badge" style={{background:'var(--zb-sage)'}}>…</span>}
          <span className="zb-rb-chevron">{routePanelOpen ? '▲' : '▼'}</span>
        </button>
        {routePanelOpen && (
          <div className="zb-rb-body">
            <div className="zb-rb-mode">
              <button className={`zb-rb-mode-btn${routeMode==='car'?' active':''}`} onClick={()=>setRouteMode('car')}>&#x1F697; Drive</button>
              <button className={`zb-rb-mode-btn${routeMode==='bike'?' active':''}`} onClick={()=>setRouteMode('bike')}>&#x1F6B4; Cycle</button>
            </div>
            <div className="zb-rb-dwell">
              <span className="zb-rb-dwell-label">Time per winery</span>
              <div className="zb-rb-dwell-btns">
                {[30,45,60,90].map(m => (
                  <button key={m} className={`zb-rb-dwell-btn${dwellMins===m?' active':''}`} onClick={()=>setDwellMins(m)}>{m}m</button>
                ))}
              </div>
            </div>
            <div className="zb-rb-stops">
              <div className="zb-rb-stop zb-rb-stop-home">
                <div className="zb-rb-num">&#x2302;</div>
                <div className="zb-rb-stop-name">25 Riebe St, Tanunda</div>
              </div>
              {routeStops.length === 0
                ? <div className="zb-rb-empty">Tap any winery pin<br/>then choose &ldquo;Add to Route&rdquo;</div>
                : routeStops.map((w, i) => (
                    <div key={w.id} className="zb-rb-stop">
                      <div className="zb-rb-num">{i+1}</div>
                      <div className="zb-rb-stop-name">{w.name}</div>
                      <button className="zb-rb-move" onClick={()=>moveStop(i,-1)} disabled={i===0} aria-label="Move up">▲</button>
                      <button className="zb-rb-move" onClick={()=>moveStop(i,1)} disabled={i===routeStops.length-1} aria-label="Move down">▼</button>
                      <button className="zb-rb-remove" onClick={()=>removeFromRoute(w.id)} aria-label="Remove">&#x2715;</button>
                    </div>
                  ))
              }
            </div>
            {apptWarning && (
              <div className="zb-rb-appt-warn">
                <span>📅</span>
                <span><b>{apptWarning}</b> recommends booking ahead — call before you go.</span>
              </div>
            )}
            {routeStops.length > 0 && (
              <>
                <div className="zb-rb-dwell" style={{marginTop:'6px'}}>
                  <span className="zb-rb-dwell-label">Return home</span>
                  <label className="zb-switch" style={{transform:'scale(.85)', transformOrigin:'right center'}}>
                    <input type="checkbox" checked={returnHome} onChange={e=>setReturnHome(e.target.checked)}/>
                    <span className="slider"/>
                  </label>
                </div>
                {routeInfo && routeInfo.loading && (
                  <div className="zb-rb-summary" style={{color:'var(--zb-label-3)'}}>Planning route…</div>
                )}
                {routeInfo && !routeInfo.loading && (
                  <div className="zb-rb-summary">
                    <span>{routeInfo.km} km</span>
                    <span className="zb-rb-dot">·</span>
                    <span>Drive {typeof routeInfo.min === 'number' ? fmtMin(routeInfo.min) : routeInfo.min}</span>
                    {routeInfo.totalMin && <>
                      <span className="zb-rb-dot">·</span>
                      <span className="zb-rb-total">~{fmtMin(routeInfo.totalMin)} total</span>
                    </>}
                    {routeInfo.estimated && <span className="est"> est.</span>}
                  </div>
                )}
                {routeStops.length >= 2 && (
                  <button className="zb-rb-clear" style={{marginTop:'8px', color:'var(--zb-earth)', borderColor:'var(--zb-earth-mid)'}} onClick={optimiseStops}>&#x2728; Optimise order</button>
                )}
                {routeInfo && !routeInfo.loading && (
                  <div style={{display:'flex', gap:'5px', marginTop:'6px'}}>
                    <a className="zb-rb-gmaps" style={{flex:1, marginTop:0}} href={buildGoogleMapsUrl()} target="_blank" rel="noopener noreferrer">&#x1F5FA; Maps</a>
                    <button className="zb-rb-gmaps" style={{flex:1, marginTop:0, border:'1px solid var(--zb-earth-mid)', color:'var(--zb-earth)', background:'transparent', cursor:'pointer', fontFamily:'var(--zb-font-sans)'}} onClick={()=>setDayPlanOpen(true)}>&#x1F4CB; Day Plan</button>
                  </div>
                )}
                <button className="zb-rb-clear" onClick={()=>{setRouteStops([]);setRouteInfo(null);clearRoute();}}>Clear all stops</button>
              </>
            )}
          </div>
        )}
      </div>

      {/* Bottom control bar — search + filters */}
      <div className="zb-bottom-bar">
        {searchResults.length > 0 && (
          <div className="zb-map-search-results" style={{marginBottom:'4px'}}>
            {searchResults.map(w => (
              <div key={w.id} className="zb-map-search-result" onMouseDown={()=>{ flyToWinery(w); setMapSearch(''); }}>
                {w.name}
                <small>{deriveStatus(w) === 'visited' ? 'Visited' : deriveStatus(w) === 'shortlisted' ? 'Shortlisted' : 'Not yet visited'}</small>
              </div>
            ))}
          </div>
        )}
        <div className="zb-bb-search-row">
          <div className="zb-map-search-wrap" style={{width:'100%'}}>
            <span className="zb-map-search-icon">&#x1F50D;</span>
            <input
              className="zb-map-search-input"
              type="text"
              placeholder="Find a winery…"
              value={mapSearch}
              onChange={e=>setMapSearch(e.target.value)}
              onBlur={()=>setTimeout(()=>setMapSearch(''), 200)}
              aria-label="Search wineries"
            />
          </div>
        </div>
        <div className="zb-bb-chips-row">
          {[
            { key: 'visited',     label: 'Visited' },
            { key: 'shortlisted', label: 'Shortlisted' },
            { key: 'not_visited', label: 'Not yet' },
          ].map(f => (
            <button key={f.key} className={`zb-map-filter-btn ${f.key}${mapFilter===f.key?' active':''}`}
              onClick={()=>setMapFilter(prev => prev===f.key ? null : f.key)} aria-pressed={mapFilter===f.key}
            >{f.label}</button>
          ))}
          <div className="zb-bb-chip-sep"/>
          {Object.entries(TAG_META).map(([key, m]) => (
            <button key={key} className={`zb-map-tag-btn ${key}${tagFilter===key?' active':''}`}
              onClick={()=>setTagFilter(prev => prev===key ? null : key)} aria-pressed={tagFilter===key}
            >{m.label}</button>
          ))}
        </div>
      </div>



      <div className="zb-route-pill" id="zb-route-pill" role="status" aria-live="polite">
        <span className="pip"/>
        <span id="zb-route-pill-text"><b>Route ready</b> · — km · — min</span>
        <button className="close" onClick={clearRoute} aria-label="Clear route">✕</button>
      </div>

      {dayPlanOpen && routeInfo && !routeInfo.loading && (
        <DayPlanModal
          stops={routeStops}
          legMins={routeInfo.legMins || []}
          dwellMins={dwellMins}
          returnHome={returnHome}
          routeKm={routeInfo.km}
          onClose={()=>setDayPlanOpen(false)}
        />
      )}

      {/* Focus mode toggle — always visible */}
      <button
        className={`zb-focus-btn${focusMode ? ' active' : ''}`}
        onClick={()=>{ setFocusMode(o=>!o); setSettingsOpen(false); }}
        title={focusMode ? 'Exit focus mode' : 'Focus mode — hide panels'}
        aria-label={focusMode ? 'Exit focus mode' : 'Focus mode'}
      >{focusMode ? '⊠' : '⊡'}</button>

      {/* Geolocation */}
      <button
        className={`zb-geo-btn${geoLoading ? ' loading' : ''}`}
        onClick={() => {
          if (!navigator.geolocation) return;
          setGeoLoading(true);
          navigator.geolocation.getCurrentPosition(
            pos => {
              setGeoLoading(false);
              const map = mapRef.current; if (!map) return;
              map.flyTo([pos.coords.latitude, pos.coords.longitude], 15, { animate:true, duration:1.2 });
            },
            () => setGeoLoading(false),
            { timeout: 8000 }
          );
        }}
        title="Find my location"
        aria-label="Find my location"
        disabled={geoLoading}
      >&#x1F4CD;</button>
    </div>
  );
};


// ─── MINI MAP — simplified preview for the home page ─────────────────────────
const MiniMap = ({ wineries, onNavigate }) => {
  const visited     = wineries.filter(w=>w.visited).length;
  const shortlisted = wineries.filter(w=>w.shortlisted).length;
  const pct         = Math.round((visited/wineries.length)*100);
  const containerRef = useRef(null);
  const mapRef       = useRef(null);

  useEffect(() => {
    if (!window.L || !containerRef.current || mapRef.current) return;
    const L = window.L;

    const map = L.map(containerRef.current, {
      center: [-34.515, 138.955],
      zoom: 12,
      zoomControl: false,
      attributionControl: false,
      dragging: false,
      scrollWheelZoom: false,
      doubleClickZoom: false,
      boxZoom: false,
      keyboard: false,
      tap: false,
      touchZoom: false,
      inertia: false,
    });

    // Same tile layer + same CSS filter (from .leaflet-tile-pane global rule)
    L.tileLayer(
      'https://{s}.basemaps.cartocdn.com/rastertiles/voyager/{z}/{x}/{y}{r}.png',
      { subdomains:'abcd', maxZoom:19 }
    ).addTo(map);

    // Home base — same SVG marker as the full map
    const homeSize = 46, homeH = Math.round(homeSize * 0.88);
    L.marker([HOME_BASE.lat, HOME_BASE.lng], {
      icon: L.divIcon({
        className:'zb-marker', html: svgHome(homeSize),
        iconSize:[homeSize, homeH], iconAnchor:[homeSize/2, homeH-3],
      }),
      interactive: false,
    }).addTo(map);

    // Visited winery dots
    wineries.forEach(w => {
      const coords = WINERY_COORDS[w.id];

      L.circleMarker([coords[0], coords[1]], {

        radius: 4, fillColor:'#a87820', color:'#fff',

    mapRef.current = map;

      onMouseLeave={e=>{e.currentTarget.style.boxShadow="0 3px 18px rgba(126,30,48,0.10), 0 0 0 1.5px #e5c8c0";e.currentTarget.style.transform=""}}>

      {/* Header */}
      <div style={{background:"#f9eae7",padding:"12px 16px 10px",borderBottom:"1px solid #e5c8c0",display:"flex",justifyContent:"space-between",alignItems:"center"}}>
        <div>
          <div style={{fontSize:9,color:"#9a7080",letterSpacing:"0.22em",fontWeight:700,textTransform:"uppercase",fontFamily:"'Outfit',sans-serif",marginBottom:3}}>The Valley</div>
          <div style={{display:"flex",alignItems:"baseline",gap:4}}>
            <span style={{fontFamily:"'Great Vibes',cursive",fontSize:24,color:"#7e1e30",lineHeight:0.9}}>Ze</span>
            <span style={{fontFamily:"'Cormorant Garamond',Georgia,serif",fontSize:13,fontWeight:600,letterSpacing:"0.18em",textTransform:"uppercase",color:"#1a080c"}}>Barossa</span>

// ─── MAIN APP ─────────────────────────────────────────────────────────────────
function App() {
  const [wineries, setWineries] = useState(() => {
    try { const s=localStorage.getItem("barossa_v3"); return s?JSON.parse(s):INITIAL_DATA; } catch { return INITIAL_DATA; }
  });
  const [syncStatus, setSyncStatus] = useState(_sb ? 'loading' : 'local');
  const [view, setView] = useState("home");
  const [search, setSearch] = useState("");
  const [sortBy, setSortBy] = useState("name");
  const [ratingFilter, setRatingFilter] = useState("overall");
  const [minRating, setMinRating] = useState(0);
  const [activeTagFilters, setActiveTagFilters] = useState(new Set());
  const [showFilters, setShowFilters] = useState(false);
  const [selected, setSelected] = useState(null);
  const [showAdd, setShowAdd] = useState(false);
  const [showScrollTop, setShowScrollTop] = useState(false);
  const listRef = useRef(null);
  const skipRealtimeRef = useRef(false);

  // ── Supabase: initial load + seed ──
  useEffect(() => {
    if (!_sb) return;
    dbLoad().then(rows => {
      if (!rows) return;
      if (rows.length === 0) {
        // First time: seed DB from localStorage / INITIAL_DATA
        const seed = (() => { try { const s=localStorage.getItem("barossa_v3"); return s?JSON.parse(s):INITIAL_DATA; } catch { return INITIAL_DATA; } })();
        dbUpsertMany(seed).catch(console.error);
        setWineries(seed);
      } else {
        setWineries(rows);
      }
      setSyncStatus('synced');
    }).catch(e => {
      console.warn('Supabase unavailable, using local data', e);
      setSyncStatus('offline');
    });
  }, []);

  // ── Supabase: realtime subscription ──
  useEffect(() => {
    if (!_sb) return;
    return dbSubscribe(updated => {
      if (skipRealtimeRef.current) return;
      setWineries(ws => ws.map(w => w.id === updated.id ? updated : w));
    });
  }, []);

  // ── Keep localStorage in sync as a backup ──
  useEffect(()=>{ try{localStorage.setItem("barossa_v3",JSON.stringify(wineries));}catch{} },[wineries]);

  const handleScroll = useCallback((e) => {
    setShowScrollTop(e.target.scrollTop > 300);
  }, []);

  const tabs = [
    {id:"home",label:"Home",icon:<Icons.Home size={16}/>},
    {id:"leaderboard",label:"Stats",icon:<Icons.Trophy size={16}/>},
    {id:"all",label:"All",icon:<Icons.Map size={16}/>},
    {id:"visited",label:"Visited",icon:<Icons.Check size={16}/>},
    {id:"notyet",label:"Not Yet",icon:<Icons.WineGlass size={16}/>},
    {id:"shortlist",label:"Shortlist",icon:<Icons.Star size={16}/>},
    {id:"map",label:"Map",icon:<Icons.Pin size={16}/>},
  ];

  const getRatingValue = (w, field) => field === "overall" ? getOverall(w) : avgRatingField(w, field);

  const filtered = wineries.filter(w => {
    if (search && !w.name.toLowerCase().includes(search.toLowerCase())) return false;
    if (view==="visited" && !w.visited) return false;
    if (view==="notyet" && w.visited) return false;
    if (view==="shortlist" && !w.shortlisted) return false;
    if (minRating > 0) {
      const val = getRatingValue(w, ratingFilter);
      if (val == null || val < minRating) return false;
    }
    if (activeTagFilters.size > 0) {
      const wTags = WINERY_TAGS[w.id] || [];
      if (![...activeTagFilters].every(t => wTags.includes(t))) return false;
    }
    return true;
  }).sort((a,b)=>{
    if (sortBy==="name") return a.name.localeCompare(b.name);
    if (sortBy==="distRiebe") return a.distRiebe-b.distRiebe;
    if (sortBy==="rating") return (getRatingValue(b, ratingFilter)??-1)-(getRatingValue(a, ratingFilter)??-1);
    return 0;
  });

  const syncWinery = async (w) => {
    skipRealtimeRef.current = true;
    setSyncStatus('saving');
    try { await dbUpsert(w); setSyncStatus('synced'); }
    catch { setSyncStatus('offline'); }
    finally { setTimeout(() => { skipRealtimeRef.current = false; }, 500); }
  };

  const handleSave = (updated) => {
    setWineries(ws=>ws.map(w=>w.id===updated.id?updated:w));
    setSelected(updated);
    syncWinery(updated);
  };
  const handleToggle = (id) => {
    setWineries(ws=>ws.map(w=>{
      if (w.id!==id) return w;
      const updated = {...w,shortlisted:!w.shortlisted};
      syncWinery(updated);
      return updated;
    }));
    if(selected?.id===id) setSelected(s=>({...s,shortlisted:!s.shortlisted}));
  };
  const handleAdd = (w) => { setWineries(ws=>[...ws,w]); syncWinery(w); };

  const selectedLive = selected ? wineries.find(w=>w.id===selected.id)||selected : null;
  const showList = ["all","visited","notyet","shortlist"].includes(view);

  return (
    <div style={{height:"100%",background:C.cream,width:"100%",maxWidth:"100%",fontFamily:"'Helvetica Neue',Arial,sans-serif",display:"flex",flexDirection:"column",overflow:"hidden"}}>

      <div className="zb-header" style={{background:C.cream,borderBottom:`1px solid ${C.border}`,padding:"14px 16px 0",position:"sticky",top:0,zIndex:50}}>
        <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:10}}>
          <div style={{display:"flex",alignItems:"center",gap:8}}>
            <Icons.Grape size={26} color={C.sage}/>
            <div>
              <div className="zb-wordmark">
                <span className="zb-wordmark-script">Ze</span>
                <span className="zb-wordmark-name">Barossa</span>
              </div>
              {_sb && (
                <div style={{fontSize:9,fontWeight:700,letterSpacing:0.4,marginTop:1,
                  color: syncStatus==='synced'?C.sage : syncStatus==='saving'?C.earth : syncStatus==='loading'?C.textLight : C.dustyPink}}>
                  {syncStatus==='synced'?'● SYNCED' : syncStatus==='saving'?'↑ SAVING…' : syncStatus==='loading'?'◌ LOADING…' : '⚠ OFFLINE'}
                </div>
              )}
            </div>
          </div>
          <div style={{display:"flex",gap:8}}>
            <button onClick={()=>setShowAdd(true)} style={{background:C.earth,color:"white",border:"none",borderRadius:10,padding:"8px 14px",minHeight:36,fontSize:13,fontWeight:700,cursor:"pointer",display:"flex",alignItems:"center",gap:4}}>
              <Icons.Plus size={15} color="white"/>Add
            </button>
          </div>
        </div>
        {/* Tab bar */}
        <div style={{display:"flex",gap:0,overflowX:"auto",scrollbarWidth:"none",marginLeft:-16,paddingLeft:16,marginRight:-16,paddingRight:16}}>
          {tabs.map(t=>(
            <button key={t.id} onClick={()=>setView(t.id)} style={{padding:"10px 12px",border:"none",background:"transparent",cursor:"pointer",fontSize:13,fontWeight:view===t.id?700:400,color:view===t.id?C.earth:C.textLight,borderBottom:`2px solid ${view===t.id?C.earth:"transparent"}`,whiteSpace:"nowrap",display:"flex",alignItems:"center",gap:4,flexShrink:0}}>
              {t.icon}{t.label}
            </button>
          ))}
        </div>
      </div>

      {/* Search + Filter bar for list views */}
      {showList && (
        <div style={{background:C.cream,borderBottom:`1px solid ${C.border}`}}>
          <div style={{padding:"10px 16px",display:"flex",gap:8}}>
            <input type="text" value={search} onChange={e=>setSearch(e.target.value)} placeholder="Search wineries…" style={{flex:1,padding:"8px 12px",borderRadius:10,border:`1px solid ${C.border}`,fontSize:14,background:C.white}}/>
            <select value={sortBy} onChange={e=>setSortBy(e.target.value)} style={{padding:"8px 6px",borderRadius:10,border:`1px solid ${C.border}`,fontSize:12,background:C.white,color:C.textMid}}>
              <option value="name">A–Z</option>

              <option value="rating">Rating ↓</option>
            </select>
            <button onClick={()=>setShowFilters(f=>!f)} aria-label="Filter" style={{padding:"4px 8px 4px 4px",borderRadius:22,border:`1px solid ${showFilters||minRating>0||activeTagFilters.size>0?C.earth:C.border}`,background:showFilters||minRating>0||activeTagFilters.size>0?C.earthLight:"white",fontSize:12,color:showFilters||minRating>0||activeTagFilters.size>0?C.earth:C.textMid,fontWeight:600,cursor:"pointer",flexShrink:0,display:"flex",alignItems:"center",gap:5}}>

                  <span>Any</span><span>5</span><span>9/10</span>
                </div>
                {minRating>0&&<button onClick={()=>{setMinRating(0);setRatingFilter("overall");}} style={{marginTop:8,fontSize:11,color:C.dustyPink,background:"none",border:"none",cursor:"pointer",padding:0,fontWeight:600}}>✕ Clear filter</button>}
              </div>
              <div style={{background:C.white,border:`1px solid ${C.border}`,borderRadius:12,padding:"12px 14px",marginTop:8}}>
                <div style={{fontSize:11,color:C.textMid,fontWeight:700,marginBottom:8,letterSpacing:0.3}}>FILTER BY CATEGORY</div>
                <div style={{display:"flex",gap:6,flexWrap:"wrap"}}>
                  {Object.entries(TAG_META).map(([key,meta])=>{
                    const active = activeTagFilters.has(key);
                    return (
                      <button key={key} onClick={()=>setActiveTagFilters(prev=>{const s=new Set(prev);active?s.delete(key):s.add(key);return s;})}
                        style={{padding:"5px 12px",borderRadius:20,border:`1.5px solid ${active?C.earth:C.border}`,background:active?C.earthLight:"transparent",color:active?C.earth:C.textMid,fontSize:12,fontWeight:active?700:400,cursor:"pointer",transition:"all .12s"}}>
                        {meta.label}
                      </button>
                    );
                  })}
                </div>
                {activeTagFilters.size>0&&<button onClick={()=>setActiveTagFilters(new Set())} style={{marginTop:8,fontSize:11,color:C.dustyPink,background:"none",border:"none",cursor:"pointer",padding:0,fontWeight:600}}>✕ Clear tags</button>}
              </div>
            </div>
          )}
        </div>
      )}

      {/* Content */}
      <div ref={listRef} onScroll={handleScroll} style={{flex:1,minHeight:0,overflowY:"auto",WebkitOverflowScrolling:"touch",overscrollBehavior:"contain",width:"100%",padding:showList?"12px 16px 80px":0}}>
        {view==="home" && <HomePage wineries={wineries} onNavigate={setView} onSearch={q=>{setSearch(q);setView("all");}}/>}
        {view==="leaderboard" && <div style={{padding:"16px 16px 80px",overflowY:"auto",WebkitOverflowScrolling:"touch",flex:1,minHeight:0}}><Stats wineries={wineries} onSelect={setSelected}/></div>}
        {view==="map" && <MapView wineries={wineries} onSelect={setSelected}/>}
        {showList && (
          filtered.length===0?(
            <div style={{textAlign:"center",padding:"40px 20px",color:C.textLight}}>
              <div style={{marginBottom:12}}><Icons.Grape size={40} color={C.border}/></div>
              <div style={{fontFamily:"Georgia,serif",fontSize:15,color:C.textMid}}>{view==="shortlist"?"No wineries on your shortlist yet":"No wineries found"}</div>
            </div>
          ):filtered.map(w=>(
            <WineryCard key={w.id} winery={w} onOpen={setSelected} onToggleShortlist={handleToggle}/>
          ))
        )}
      </div>

      {/* Scroll to top */}
      {showScrollTop && (
        <button onClick={()=>listRef.current?.scrollTo({top:0,behavior:"smooth"})} style={{position:"fixed",bottom:20,right:20,width:44,height:44,borderRadius:"50%",background:C.earth,color:"white",border:"none",cursor:"pointer",display:"flex",alignItems:"center",justifyContent:"center",boxShadow:"0 4px 14px rgba(100,60,20,0.3)",zIndex:100}}>
          <Icons.ChevronUp size={20} color="white"/>
        </button>
      )}

      {/* Detail Modal */}
      {selectedLive && <DetailModal winery={selectedLive} onClose={()=>setSelected(null)} onSave={handleSave} onToggleShortlist={handleToggle}/>}

      {/* Add Modal */}
      {showAdd && <AddModal onClose={()=>setShowAdd(false)} onAdd={handleAdd}/>}
    </div>
  );
}

const root = ReactDOM.createRoot(document.getElementById('root'));
root.render(React.createElement(App));
</script>
</body>
</html>
